services:
  - type: web
    name: darabilim-ai
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

      - key: SECRET_KEY
        generateValue: true
